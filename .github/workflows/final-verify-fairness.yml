name: Final verify fairness release

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Eignungsregeln.txt'
      - '.github/workflows/final-verify-fairness.yml'

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.head_ref == 'agent/fairness-tooltip-readme' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fairness-tooltip-readme
          fetch-depth: 0
      - name: Syntax check
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Remove one-time verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/final-verify-fairness.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Final geprüften Fairness- und Dokumentationsstand bereitstellen"
          git push
