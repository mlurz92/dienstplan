name: Seasonal palette integration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch integration points and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          BUILD_OLD = "20260801.11"
          BUILD_NEW = "20260801.12"

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8")

          index = read("index.html")
          assert BUILD_OLD in index
          write("index.html", index.replace(BUILD_OLD, BUILD_NEW))

          app = read("js/app.js")
          assert BUILD_OLD in app
          app = app.replace(BUILD_OLD, BUILD_NEW)
          app = app.replace(
              "applyMonthTheme(state.currentMonth, { animate: false });",
              "applyMonthTheme(state.currentMonth, { animate: false, year: state.currentYear });"
          )
          app = app.replace(
              "if (targetChanged) applyMonthTheme(month);",
              "if (targetChanged) applyMonthTheme(month, { year });"
          )
          app = app.replace(
              "applyMonthTheme(state.currentMonth);",
              "applyMonthTheme(state.currentMonth, { year: state.currentYear });"
          )
          write("js/app.js", app)

          styles = read("styles.css")
          styles = styles.replace(
              "über alle zwölf Paletten auf",
              "über den vollständigen 24-Jahres-Zyklus auf"
          )
          write("styles.css", styles)

          readme = read("README.md")
          assert BUILD_OLD in readme
          readme = readme.replace(BUILD_OLD, BUILD_NEW)
          start_marker = "## 14.2 Zwölf Monatsidentitäten"
          end_marker = "## 14.3 Tabellenmischungen"
          assert start_marker in readme and end_marker in readme
          start = readme.index(start_marker)
          end = readme.index(end_marker)
          replacement = """## 14.2 Saisonales Langzeit-Farbsystem

Die Monatsidentität wird nicht mehr allein aus der Monatsnummer, sondern **deterministisch aus Jahr und Monat** abgeleitet. Dadurch bleibt jede Farbe reproduzierbar, während sich derselbe Kalendermonat nicht bereits im Folgejahr wiederholt.

Das System kombiniert:

- **12 saisonale Monatsfamilien** von Winter, Vorfrühling und Blüte bis Spätherbst und Immergrün;
- **vier handkuratierte Grundvarianten je Monat**;
- **24 kontrollierte Trend-Editionen** mit fein begrenzten Änderungen von Farbton, Helligkeit und Buntheit;
- insgesamt **288 eindeutige Monatspaletten**;
- einen definierten **24-Jahres-Zyklus** mit Referenzjahr 2026.

| Zeitraum | Saisonale Farbfamilie | Typische Varianten |
|---|---|---|
| Januar | Frost | Eisnebel, Polarlicht, Winterflieder, arktischer Stahl |
| Februar | Beere | Rubinrose, Winterbeere, Orchideenrauch, Granatapfel |
| März | Botanik | Salbei, Eukalyptus, junge Olive, Celadon |
| April | Blüte | Lavendel, Wisteria, Irisblau, Fliederregen |
| Mai | Grün | Frühlingsgrün, Minzblatt, Chartreuse-Salbei, Maigrün |
| Juni | Wasser | Türkis, Lagune, Aqua Mineral, Meeresglas |
| Juli | Sonnenfrucht | Koralle, Persimone, Wassermelone, Sonnenuntergang |
| August | Gold | Bernstein, Safran, Aprikosengold, Ringelblume |
| September | Pflaume | Pflaume, Feige, Aubergine, Weinlese |
| Oktober | Erde | Kupfer, Terrakotta, Zimt, Bronze |
| November | Mineral | Schieferblau, Sturmblau, Petrolgrau, Indigonebel |
| Dezember | Immergrün | Tannengrün, Wacholder, Smaragdnacht, Winterwald |

Die Trend-Editionen greifen zeitgemäße Richtungen wie **Quiet Luxury**, **Organic Modern**, **Botanical Jade**, **Plum Noir**, **Persimmon Pop**, **Soft Chrome** oder **Digital Bloom** auf. Ihre Wirkung ist bewusst begrenzt: Der Januar bleibt winterlich, der Juli sommerlich, der Oktober erdig und der Dezember immergrün.

Jede generierte Palette besitzt:

- einen eindeutigen Kalender-Schlüssel `JJJJ-MM`;
- Saison, Farbfamilie und Editionsname als Metadaten;
- Grundakzent und starken Akzent;
- Glow und Paneltönung;
- automatisch vertieften Schriftton;
- abgeleitete Wochenend- und Feiertagsflächen;
- eine sichtbare Badge-Beschriftung sowie einen ausführlichen Tooltip.

Die Auswahl verwendet keine Laufzeit-Zufallszahlen. Derselbe Monat desselben Jahres erhält auf jedem Gerät und nach jedem Neuladen exakt dieselbe Palette. Erst nach 24 Jahren beginnt der kontrollierte Zyklus erneut.

"""
          readme = readme[:start] + replacement + readme[end:]
          write("README.md", readme)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate syntax and unit tests
        run: npm run check && npm test

      - name: Commit integrated result and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/seasonal-palettes-maintenance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html js/app.js styles.css .github/workflows/seasonal-palettes-maintenance.yml
          git commit -m "Saisonales Langzeit-Farbsystem vollständig integrieren"
          git push origin HEAD:${{ github.head_ref }}
