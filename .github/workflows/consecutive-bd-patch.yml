name: Consecutive BD patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/consecutive-bd-red-conflict' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consecutive-bd-red-conflict
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply focused rule change
        run: python tools/apply_consecutive_bd_rule.py

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f tools/apply_consecutive_bd_rule.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unmittelbar aufeinanderfolgende BD rot sperren"
          git push origin HEAD:agent/consecutive-bd-red-conflict
