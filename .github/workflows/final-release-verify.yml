name: Final release verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/final-release-verify.yml'
      - '.github/workflows/ci.yml'
      - 'Eignungsregeln.txt'
      - 'README.md'
      - 'functions/**'
      - 'index.html'
      - 'js/**'
      - 'package*.json'
      - 'playwright.config.js'
      - 'tests/**'

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.head_ref == 'agent/final-consistency-hardening' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-consistency-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Release audit
        run: |
          set -euo pipefail
          test "$(git rev-list --count origin/main..HEAD)" -ge 1
          ! git ls-files | grep -E '^(node_modules|test-results|playwright-report)/'
          ! grep -R "20260730.6" index.html js tests README.md
          grep -F "echtes FZA" Eignungsregeln.txt
          grep -F "listAllMonthKeys" functions/api/export.js
          grep -F "dirtyMonths" js/state.js
      - name: Remove one-time verifier
        run: |
          rm -f .github/workflows/final-release-verify.yml
          rm -rf node_modules test-results playwright-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove one-time release verifier [verified]"
          git push
