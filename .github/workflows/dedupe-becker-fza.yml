name: Deduplicate Becker FZA display

on:
  push:
    branches:
      - agent/fza-spacing-glass-readme
    paths:
      - '.github/workflows/dedupe-becker-fza.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fza-spacing-glass-readme
          fetch-depth: 0

      - name: Patch and validate Becker FZA display
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('js/app.js')
          text = path.read_text(encoding='utf-8')
          old = """    if (absence === 'fza' && absenceSource !== 'manual' && isFirstRegularWorkdayAfterOwnBd(person.id, dateIso)) {
              if (person.id === 'becker' && derivedBeckerFza) continue;
              continue;
            }"""
          new = """    if (person.id === 'becker' && absence === 'fza' && derivedBeckerFza) continue;
            if (absence === 'fza' && absenceSource !== 'manual' && isFirstRegularWorkdayAfterOwnBd(person.id, dateIso)) continue;"""
          if old not in text:
              raise SystemExit('Expected Becker FZA block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          node --check js/app.js
          grep -q "person.id === 'becker' && absence === 'fza' && derivedBeckerFza" js/app.js
          rm -f .github/workflows/dedupe-becker-fza.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prevent duplicate Becker FZA display"
          git push origin HEAD:agent/fza-spacing-glass-readme
