name: Final v9 polish once

on:
  push:
    branches: [agent/auto-plan-v9-cpsat]
    paths:
      - .github/final_polish_v9.py

permissions:
  contents: write

concurrency:
  group: final-v9-polish
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/auto-plan-v9-cpsat
          fetch-depth: 0
      - name: Patch anwenden
        run: python .github/final_polish_v9.py
      - name: Diff prüfen und committen
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v9): finalize Workflow cancellation and model-scoped proof wording [final-polish]"
          git push origin HEAD:agent/auto-plan-v9-cpsat
