name: Exhaustive bughunt

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/exhaustive-bughunt-20260731' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exhaustive-bughunt-20260731
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Align patch driver with current README and literal escapes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_exhaustive_bughunt.py')
          text = path.read_text(encoding='utf-8')
          old = 'Der Import verwendet SheetJS 0.20.3. Monatsblätter werden anhand der deutschen Kurzbezeichnungen erkannt.'
          new = 'Der Import verwendet SheetJS 0.20.3 aus dem externen CDN `cdn.sheetjs.com`. Das Skript wird mit `defer`, derzeit jedoch weder lokal vendort noch mit einem `integrity`-Attribut geladen. Ist die Bibliothek nicht verfügbar, bleiben Kernplanung, JSON-Sicherung und Druck funktionsfähig; nur Excel-Import und -Export melden einen Fehler.'
          if text.count(old) != 2:
              raise SystemExit(f'expected two Excel anchor occurrences, found {text.count(old)}')
          text = text.replace(old, new)
          old_sub = 'pattern.subn(replacement, text, count=1)'
          if text.count(old_sub) != 4:
              raise SystemExit(f'expected four regex substitutions, found {text.count(old_sub)}')
          text = text.replace(old_sub, 'pattern.subn(lambda _match: replacement, text, count=1)')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply exhaustive bughunt fixes
        run: python tools/apply_exhaustive_bughunt.py
      - name: Align regression tests with serialized saves and new release token
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/bughunt-regressions.test.js')
          text = path.read_text(encoding='utf-8')
          old = "  month.days['2026-07-01'].bd = 'becker';\n  markMonthDirty(2026, 7);"
          new = "  getMonthData(2026, 7).days['2026-07-01'].bd = 'becker';\n  markMonthDirty(2026, 7);"
          if text.count(old) != 1:
              raise SystemExit(f'serial test reference anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('tests/rbn.test.js')
          text = path.read_text(encoding='utf-8')
          old = r"20260731\.2"
          if text.count(old) != 1:
              raise SystemExit(f'RBN token anchor count: {text.count(old)}')
          path.write_text(text.replace(old, r"20260731\.3"), encoding='utf-8')

          path = Path('tests/state-persistence.test.js')
          text = path.read_text(encoding='utf-8')
          old = "  releaseFetch();\n  await save;"
          new = "  await new Promise(resolve => setTimeout(resolve, 0));\n  assert.equal(typeof releaseFetch, 'function');\n  releaseFetch();\n  await save;"
          if text.count(old) != 1:
              raise SystemExit(f'legacy race test anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit verified fixes
        shell: bash
        run: |
          rm -f tools/apply_exhaustive_bughunt.py .github/workflows/exhaustive-bughunt.yml BUGHUNT_FINDINGS.md BUGHUNT_TRIGGER*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Kritische Speicher-, Import- und Regelraces beheben"
          git push origin HEAD:agent/exhaustive-bughunt-20260731
