name: Temporary v9.5 final verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-v95-final:
    name: Verify final local source overlay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply final modal interaction fix
        shell: python
        run: |
          from pathlib import Path

          css = Path('auto-plan-studio-v9-5.css')
          text = css.read_text()
          needle = '''.auto-plan-dialog[data-v95-layout="1"] .auto-plan-header {
            border-bottom: 1px solid var(--v95-border);
          }
          '''
          replacement = '''.auto-plan-dialog[data-v95-layout="1"] .auto-plan-header {
            grid-template-columns: minmax(0, 1fr) auto auto;
            align-items: center;
            border-bottom: 1px solid var(--v95-border);
          }

          .auto-plan-dialog[data-v95-layout="1"] .auto-plan-headline {
            grid-column: 1;
            min-width: 0;
          }

          .auto-plan-dialog[data-v95-layout="1"] .auto-plan-modal-theme-toggle {
            grid-column: 2;
            grid-row: 1;
            align-self: center;
            justify-self: end;
            position: relative;
            z-index: 22;
            margin: 0;
          }

          .auto-plan-dialog[data-v95-layout="1"] .auto-plan-close {
            grid-column: 3;
            grid-row: 1;
            align-self: center;
            position: relative;
            z-index: 22;
          }
          '''
          if needle not in text:
              raise SystemExit('CSS insertion point not found')
          css.write_text(text.replace(needle, replacement, 1))

          polish = Path('js/auto-plan-studio-v9-5-polish.js')
          text = polish.read_text()
          polish.write_text(text.replace("const RELEASE = '20260805.2';", "const RELEASE = '20260805.3';"))
      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Vendor and type build
        run: npm run build
      - name: Complete Node regression suite
        timeout-minutes: 20
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Complete browser regression suite
        timeout-minutes: 15
        run: npm run test:e2e
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v95-final-verification
          path: |
            playwright-report
            test-results
          retention-days: 1
          if-no-files-found: ignore
