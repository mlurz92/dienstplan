name: Temporary v9.5 bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap-v95:
    name: Generate lock and verify complete repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Generate exact lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Install exact dependencies
        run: npm ci
      - name: Static checks
        run: npm run check
      - name: Vendor and type build
        run: npm run build
      - name: Complete Node regression suite
        timeout-minutes: 20
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Complete browser regression suite
        timeout-minutes: 15
        run: npm run test:e2e
      - name: Upload generated repository files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v95-complete-verify-files
          path: |
            package-lock.json
            vendor/floating-ui
            vendor/or-tools-wasm
            playwright-report
            test-results
          retention-days: 1
          if-no-files-found: ignore
