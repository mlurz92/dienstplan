name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, Regeln und Browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Abhängigkeiten reproduzierbar installieren
        run: npm ci
      - name: Syntax und Lieferumfang prüfen
        run: npm run check
      - name: Vendor-Build und Typprüfung
        run: npm run build
      - name: Node-Regressionen
        timeout-minutes: 20
        run: npm test
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Browser-Regressionen
        timeout-minutes: 20
        run: npm run test:e2e
      - name: Playwright-Diagnostik sichern
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
