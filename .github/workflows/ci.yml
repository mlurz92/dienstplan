name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Bootstrap exact lockfile for v9.5 toolchain
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - name: Append README toolchain documentation
        run: node scripts/append-readme-v95-tooling.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Generated v9.5 assets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v95-generated-assets
          path: |
            package-lock.json
            README.md
            vendor/floating-ui
            vendor/or-tools-wasm
          if-no-files-found: error
          retention-days: 7
      - name: Playwright-Diagnostik sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
