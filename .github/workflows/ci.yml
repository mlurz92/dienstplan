name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend, Regeln und Browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:v9
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Playwright-Diagnostik sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  native-solver:
    name: Python CP-SAT, Benchmark und Container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: solver/pyproject.toml
      - run: python -m pip install --upgrade pip==25.2
      - run: python -m pip install -e './solver[dev]'
      - run: ruff check solver
      - run: mypy solver/app
      - run: python -m compileall -q solver/app solver/tests solver/benchmarks
      - run: pytest solver
      - name: Deterministischer v9-Smoke-Benchmark
        run: python solver/benchmarks/benchmark_v9.py --smoke --repetitions 2 --output solver/benchmark-results/v9-smoke.json
      - uses: docker/setup-buildx-action@v3
      - name: Solvercontainer bauen
        uses: docker/build-push-action@v7
        with:
          context: solver
          file: solver/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=autoplan-v9-solver
          cache-to: type=gha,mode=max,scope=autoplan-v9-solver

  cloudflare-worker:
    name: Cloudflare Solver Worker und Durable Objects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/autoplan-v9
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist

  month-state-worker:
    name: Revisionssichere Monatspersistenz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/month-state
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist
