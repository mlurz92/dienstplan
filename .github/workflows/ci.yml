name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize-v9:
    name: Einmalige v9-Finalisierung
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/auto-plan-v9-cpsat
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
      - name: Finalisierung anwenden
        run: python .github/finalize_v9.py
      - name: Endgültiges CI-Gate einsetzen
        run: |
          cp .github/final-ci.yml.template .github/workflows/ci.yml
          rm -f .github/final-ci.yml.template
          sed -i 's/[[:space:]]\+$//' README.md
      - name: Diff prüfen und pushen
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(v9): finalize production integration [finalize-v9]"
          git push origin HEAD:agent/auto-plan-v9-cpsat

  frontend:
    name: Frontend, Regeln und Browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:v9
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Playwright-Diagnostik sichern
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  native-solver:
    name: Python CP-SAT und Container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
          cache: pip
          cache-dependency-path: solver/pyproject.toml
      - run: python -m pip install --upgrade pip==25.2
      - run: python -m pip install -e './solver[dev]'
      - run: ruff check solver
      - run: mypy solver/app
      - run: python -m compileall -q solver/app solver/tests
      - run: pytest solver
      - uses: docker/setup-buildx-action@v3
      - name: Solvercontainer bauen
        uses: docker/build-push-action@v7
        with:
          context: solver
          file: solver/Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=autoplan-v9-solver
          cache-to: type=gha,mode=max,scope=autoplan-v9-solver

  cloudflare-worker:
    name: Cloudflare Worker und Durable Objects
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: workers/autoplan-v9
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist
