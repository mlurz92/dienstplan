name: Final audit fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-final-edge-case:
    if: github.head_ref == 'agent/exhaustive-bughunt-20260731' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exhaustive-bughunt-20260731
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove unreachable bootstrap call and add regression guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('js/app.js')
          text = app.read_text(encoding='utf-8')
          old = "  if (importsBootstrap) markBootstrapDirty();\n  else saveLocalBootstrap();"
          new = "  if (importsBootstrap) markBootstrapDirty();"
          if text.count(old) != 1:
              raise SystemExit(f'JSON import edge-case anchor count: {text.count(old)}')
          app.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/bughunt-regressions.test.js')
          content = test.read_text(encoding='utf-8').rstrip()
          content += '''\n\ntest('reiner Monats-JSON-Import verwendet keine nicht importierte Bootstrap-Funktion', async () => {\n  const source = await readFile(new URL('../js/app.js', import.meta.url), 'utf8');\n  assert.doesNotMatch(source, /else saveLocalBootstrap\\(\\)/);\n  assert.match(source, /if \\(importsBootstrap\\) markBootstrapDirty\\(\\)/);\n});\n'''
          test.write_text(content, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit verified final audit fix
        shell: bash
        run: |
          rm -f .github/workflows/final-audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Monatsweisen JSON-Import ohne Bootstrapdaten absichern"
          git push origin HEAD:agent/exhaustive-bughunt-20260731
