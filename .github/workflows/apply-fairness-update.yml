name: Apply fairness update

on:
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - '.github/apply-fairness-update.py'
      - '.github/workflows/apply-fairness-update.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.head_ref == 'agent/fairness-tooltip-readme' && !contains(github.event.pull_request.title, '[applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fairness-tooltip-readme
          fetch-depth: 0
      - name: Apply reviewed changes
        run: python .github/apply-fairness-update.py
      - name: Normalize generated regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for path in Path('tests').glob('*.test.js'):
              source = path.read_text(encoding='utf-8')
              path.write_text(source.replace('20260730\\.4', '20260730\\.5').replace('20260730.4', '20260730.5'), encoding='utf-8')

          path = Path('tests/recommendation-rules.test.js')
          source = path.read_text(encoding='utf-8')
          marker = "test('Jahresverlauf ist im Regelquelltext nicht bewertungswirksam verdrahtet'"
          start = source.index(marker)
          source = source[:start] + """test('Jahresverlauf ist im Regelquelltext nicht bewertungswirksam verdrahtet', () => {
            const rules = readFileSync(new URL('../js/rules-evaluation.js', import.meta.url), 'utf8');
            assert.equal(rules.includes("recommend('Jahresverlauf"), false);
            assert.equal(rules.includes("push('yellow', `Jahresverlauf"), false);
            assert.match(rules, /note\\(`Jahresverlauf \\(nur Hinweis, ohne Einfluss auf Bewertung\\)/);
          });
          """
          path.write_text(source, encoding='utf-8')
          PY
      - name: Syntax check
        run: npm run check
      - name: Full test suite
        run: npm test
      - name: Commit verified final source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/apply-fairness-update.py
          rm -f .github/workflows/apply-fairness-update.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fairnessbewertung präzisieren und README vollständig erneuern [applied]"
          git push
