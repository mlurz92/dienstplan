name: Expand application payload

on:
  push:
    branches:
      - agent/dienstplanrad-initial-app

permissions:
  contents: write

jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, '[expanded]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Expand checked payload
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/part-* > /tmp/dienstplanrad-payload.b64
          base64 --decode /tmp/dienstplanrad-payload.b64 > /tmp/dienstplanrad-payload.zip
          echo "7201dca4f7e7b5e340f8cc9029c0af7d2ab3cf48f15144fb98635475e63761ee  /tmp/dienstplanrad-payload.zip" | sha256sum --check
          unzip -o /tmp/dienstplanrad-payload.zip -d .
          rm -rf .payload
          rm -f .github/workflows/expand-payload.yml

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Commit expanded application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete DienstplanRAD application [expanded]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
