name: Persistence restart audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-restart-safety:
    if: github.head_ref == 'agent/exhaustive-bughunt-20260731' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/exhaustive-bughunt-20260731
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Harden dirty-state restoration and backup precedence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          state = Path('js/state.js')
          text = state.read_text(encoding='utf-8')
          old = '''  try {
            const storedKeys = JSON.parse(storageGet(DIRTY_MONTHS_KEY) || '[]');
            if (Array.isArray(storedKeys)) {
              for (const key of storedKeys) {
                if (!parseMonthKey(key) || !storageGet(`${LOCAL_KEY_PREFIX}month:${key}`)) continue;
                state.dirtyMonths.set(key, ++state.dirtyVersion);
                state.monthSources.set(key, 'local');
              }
            }
          } catch {
            storageRemove(DIRTY_MONTHS_KEY);
          }
          '''
          new = '''  try {
            const storedKeys = JSON.parse(storageGet(DIRTY_MONTHS_KEY) || '[]');
            if (Array.isArray(storedKeys)) {
              for (const key of storedKeys) {
                const parsed = parseMonthKey(key);
                const raw = parsed ? storageGet(`${LOCAL_KEY_PREFIX}month:${key}`) : null;
                if (!parsed || !raw) continue;
                try {
                  state.months.set(key, normalizeMonthData(parsed[0], parsed[1], JSON.parse(raw)));
                  state.dirtyMonths.set(key, ++state.dirtyVersion);
                  state.monthSources.set(key, 'local');
                } catch {
                  // Ein defekter lokaler Monat darf nicht als leeres Gerüst
                  // automatisch zum Server synchronisiert werden.
                }
              }
            }
            persistDirtyMarkers();
          } catch {
            storageRemove(DIRTY_MONTHS_KEY);
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'restore block count: {text.count(old)}')
          text = text.replace(old, new)

          old = '''export function buildBackupPayload(serverPayload = null) {
            restoreSyncState();
            let server = {};
            try { server = serverPayload ? normalizeBackupPayload(serverPayload, { strict: false }) : {}; }
            catch { server = {}; }

            const months = new Map(server.months || []);
            for (const [key, month] of readAllLocalMonths()) {
              if (!months.has(key) || state.dirtyMonths.has(key)) months.set(key, month);
            }
            for (const [key, month] of state.months) {
              const source = state.monthSources.get(key);
              if (!months.has(key) || state.dirtyMonths.has(key) || source === 'local' || source === 'fallback') {
                const parsed = parseMonthKey(key);
                if (parsed) months.set(key, normalizeMonthData(parsed[0], parsed[1], month));
              }
            }

            return {
              ok: true,
              settings: structuredClone(state.settings),
              staff: structuredClone(state.staff),
              rbnNames: structuredClone(state.rbnNames),
              months: [...months.entries()].sort(([left], [right]) => left.localeCompare(right))
            };
          }
          '''
          new = '''export function buildBackupPayload(serverPayload = null) {
            restoreSyncState();
            let server = {};
            let hasServerSnapshot = false;
            try {
              if (serverPayload) {
                server = normalizeBackupPayload(serverPayload, { strict: false });
                hasServerSnapshot = true;
              }
            } catch {
              server = {};
              hasServerSnapshot = false;
            }

            const months = new Map(server.months || []);
            for (const [key, month] of readAllLocalMonths()) {
              if (!hasServerSnapshot || !months.has(key) || state.dirtyMonths.has(key)) months.set(key, month);
            }
            for (const [key, month] of state.months) {
              if (!hasServerSnapshot || !months.has(key) || state.dirtyMonths.has(key)) {
                const parsed = parseMonthKey(key);
                if (parsed) months.set(key, normalizeMonthData(parsed[0], parsed[1], month));
              }
            }

            const preferServerBootstrap = hasServerSnapshot && !state.bootstrapDirty;
            return {
              ok: true,
              settings: structuredClone(preferServerBootstrap && server.settings ? server.settings : state.settings),
              staff: structuredClone(preferServerBootstrap && server.staff ? server.staff : state.staff),
              rbnNames: structuredClone(preferServerBootstrap && server.rbnNames ? server.rbnNames : state.rbnNames),
              months: [...months.entries()].sort(([left], [right]) => left.localeCompare(right))
            };
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'backup block count: {text.count(old)}')
          state.write_text(text.replace(old, new), encoding='utf-8')

          app = Path('js/app.js')
          text = app.read_text(encoding='utf-8')
          old = "    if (importsBootstrap) markBootstrapSynced();\n    setStatus('saved', 'Import gespeichert');"
          new = "    if (importsBootstrap) markBootstrapSynced();\n    if (state.dirty) setStatus('saving', 'Import gespeichert – weitere Änderungen ausstehend …');\n    else setStatus('saved', 'Import gespeichert');"
          if text.count(old) != 1:
              raise SystemExit(f'import status count: {text.count(old)}')
          app.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/bughunt-regressions.test.js')
          content = test.read_text(encoding='utf-8').rstrip()
          content += '''

          test('Dirty-Monate werden nach Neustart vor dem automatischen Sync aus dem lokalen Snapshot rekonstruiert', async () => {
            globalThis.localStorage = new MemoryStorage();
            const local = createEmptyMonth(2026, 6);
            local.days['2026-06-15'].bd = 'becker';
            localStorage.setItem('dienstplanrad:month:2026-06', JSON.stringify(local));
            localStorage.setItem('dienstplanrad:dirty-months', JSON.stringify(['2026-06']));
            const bodies = [];
            globalThis.fetch = async (_url, options) => {
              bodies.push(JSON.parse(options.body));
              return okResponse();
            };
            const { persistDirtyState } = await freshState('restart-before-sync');
            await persistDirtyState();
            assert.equal(bodies.length, 1);
            assert.equal(bodies[0].days['2026-06-15'].bd, 'becker');
          });

          test('defekter Dirty-Snapshot wird verworfen statt als leerer Monat synchronisiert', async () => {
            globalThis.localStorage = new MemoryStorage();
            localStorage.setItem('dienstplanrad:month:2026-06', '{defekt');
            localStorage.setItem('dienstplanrad:dirty-months', JSON.stringify(['2026-06']));
            let fetches = 0;
            globalThis.fetch = async () => { fetches += 1; return okResponse(); };
            const { persistDirtyState, state } = await freshState('corrupt-restart');
            await persistDirtyState();
            assert.equal(fetches, 0);
            assert.equal(state.dirty, false);
            assert.equal(localStorage.getItem('dienstplanrad:dirty-months'), null);
          });

          test('Serverexport gewinnt gegen sauberen lokalen Cache, Dirty-Daten behalten Vorrang', async () => {
            globalThis.localStorage = new MemoryStorage();
            globalThis.fetch = async () => okResponse();
            const cached = createEmptyMonth(2026, 7);
            cached.days['2026-07-01'].bd = 'lurz';
            localStorage.setItem('dienstplanrad:month:2026-07', JSON.stringify(cached));
            const module = await freshState('backup-precedence');
            module.state.settings = { schemaVersion: 2 };
            const server = createEmptyMonth(2026, 7);
            server.days['2026-07-01'].bd = 'becker';
            const serverPayload = { settings: { schemaVersion: 7 }, staff: DEFAULT_STAFF, rbnNames: ['Server'], months: [['2026-07', server]] };
            const cleanBackup = module.buildBackupPayload(serverPayload);
            assert.equal(cleanBackup.settings.schemaVersion, 7);
            assert.deepEqual(cleanBackup.rbnNames, ['Server']);
            assert.equal(new Map(cleanBackup.months).get('2026-07').days['2026-07-01'].bd, 'becker');

            module.state.settings = { schemaVersion: 9 };
            module.markBootstrapDirty();
            module.getMonthData(2026, 7).days['2026-07-01'].bd = 'lurz';
            module.markMonthDirty(2026, 7);
            const dirtyBackup = module.buildBackupPayload(serverPayload);
            assert.equal(dirtyBackup.settings.schemaVersion, 9);
            assert.equal(new Map(dirtyBackup.months).get('2026-07').days['2026-07-01'].bd, 'lurz');
          });
          '''
          test.write_text(content + '\n', encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = 'Der Marker wird zusätzlich lokal persistiert, sodass ein fehlgeschlagener Save auch nach einem Browserneustart nicht durch einen älteren Serverstand verdrängt wird.'
          new = 'Der Marker und der zugehörige normalisierte Monatssnapshot werden zusätzlich lokal persistiert und beim Start gemeinsam rekonstruiert, sodass ein fehlgeschlagener Save auch nach einem Browserneustart weder durch einen älteren Serverstand noch durch ein leeres Monatsgerüst verdrängt wird.'
          if text.count(old) != 1:
              raise SystemExit(f'README dirty wording count: {text.count(old)}')
          text = text.replace(old, new)
          old = 'Ein erreichbarer Serverexport bildet die Basis; sämtliche lokal neueren oder noch nicht synchronisierten Monate werden anschließend darübergelegt.'
          new = 'Ein erreichbarer Serverexport bildet die Basis; nur nachweislich unsynchronisierte lokale Monate und Bootstrapdaten überschreiben gleichnamige Serverstände. Rein lokal gecachte, aber nicht geänderte Altstände ersetzen keine frisch exportierten Serverdaten.'
          if text.count(old) != 1:
              raise SystemExit(f'README backup wording count: {text.count(old)}')
          readme.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Commit verified restart safety
        shell: bash
        run: |
          rm -f .github/workflows/persistence-restart-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persistierte Offline-Monate beim Neustart verlustfrei rekonstruieren"
          git push origin HEAD:agent/exhaustive-bughunt-20260731
