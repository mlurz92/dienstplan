name: Patch v9 objective consistency once

on:
  push:
    branches: [agent/auto-plan-v9-cpsat]
    paths:
      - .github/patch_objective_score_v9.py

permissions:
  contents: write

concurrency:
  group: patch-v9-objective-consistency
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/auto-plan-v9-cpsat
          fetch-depth: 0
      - name: Patch anwenden
        run: python .github/patch_objective_score_v9.py
      - name: Diff prüfen und committen
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v9): align Exact-LNS acceptance with solver load objective [objective-score-patch]"
          git push origin HEAD:agent/auto-plan-v9-cpsat
