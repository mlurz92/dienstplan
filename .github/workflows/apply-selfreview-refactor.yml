name: Apply self-review refactor

on:
  push:
    branches:
      - agent/selfreview-rbn-refactor
    paths:
      - '.github/refactor-payload/**'
      - '.github/workflows/apply-selfreview-refactor.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[selfreview-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/refactor-payload/part-* | base64 --decode > /tmp/refactor.tar.xz
          echo "3df3143f0b9089d9271246efd3c6adcba2a98f36da37928f88fa7a189197a6a1  /tmp/refactor.tar.xz" | sha256sum --check -
          tar -xJf /tmp/refactor.tar.xz -C .
          rm -f js/rbn-ui.js
          rm -rf .github/refactor-payload
          rm -f .github/workflows/apply-selfreview-refactor.yml
      - name: Verify
        run: |
          npm run check
          npm test
      - name: Commit reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RBN-Rendering konsolidieren und Release bereinigen [selfreview-applied]"
          git push
