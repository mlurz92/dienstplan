name: Finalize Auto-Plan v9 once

on:
  push:
    branches: [agent/auto-plan-v9-cpsat]

permissions:
  contents: write

concurrency:
  group: finalize-auto-plan-v9
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[finalize-v9]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/auto-plan-v9-cpsat
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
      - name: Finalisierung anwenden
        run: python .github/finalize_v9.py
      - name: Diff prüfen
        run: git diff --check
      - name: Finalisierung committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(v9): finalize production integration [finalize-v9]"
          git push origin HEAD:agent/auto-plan-v9-cpsat
