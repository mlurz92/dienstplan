      <stop offset="0.36" stop-color="#69a657"/>
      <stop offset="0.52" stop-color="#f7de9b"/>
      <stop offset="0.68" stop-color="#f35e26"/>
      <stop offset="0.84" stop-color="#fba4fd"/>
      <stop offset="1" stop-color="#5c7cca"/>
    </linearGradient>
    <linearGradient id="glass" x1="72" y1="60" x2="440" y2="458" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.19"/>
      <stop offset="0.48" stop-color="#dcecf7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#dcecf7" stop-opacity="0.035"/>
    </linearGradient>
    <linearGradient id="glass-stroke" x1="76" y1="62" x2="436" y2="452" gradientUnits="userSpaceOnUse">
