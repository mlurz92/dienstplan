<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DienstplanRAD App-Icon</title>
  <desc id="desc">Ein farbiges Constraint-Netz rotiert in einer gläsernen Kalenderfläche um den leuchtenden Auto-Plan-Kern.</desc>
  <defs>
    <linearGradient id="background" x1="56" y1="24" x2="456" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#192838"/>
      <stop offset="0.48" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#070a11"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="104" y1="0" x2="408" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14b6f7"/>
