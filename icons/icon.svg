      <stop offset="0.42" stop-color="#b9d6ea" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientTransform="translate(238 263) rotate(52) scale(94)">
      <stop stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#bffaff"/>
      <stop offset="0.48" stop-color="#5feedc"/>
      <stop offset="0.74" stop-color="#5c7cca"/>
      <stop offset="1" stop-color="#1d2d62"/>
    </radialGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(256 282) scale(178)">
      <stop stop-color="#5feedc" stop-opacity="0.24"/>
      <stop offset="0.55" stop-color="#5c7cca" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#5c7cca" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="175%">
