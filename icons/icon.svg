    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="outer-clip"><rect width="512" height="512" rx="116"/></clipPath>
    <clipPath id="page-clip"><rect x="64" y="64" width="384" height="392" rx="92"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#background)"/>
  <circle cx="92" cy="92" r="170" fill="#14b6f7" opacity="0.08" clip-path="url(#outer-clip)"/>
  <circle cx="448" cy="392" r="190" fill="#fba4fd" opacity="0.075" clip-path="url(#outer-clip)"/>
