<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DienstplanRAD animiertes App Icon</title>
  <desc id="desc">Kalendertabelle, deren Felder langsam durch die zwölf Monatsfarben wandern.</desc>
  <style>
