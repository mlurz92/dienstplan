    .orb-c{animation:orbC 13s ease-in-out infinite alternate}
    .sheen{animation:sheen 7.5s cubic-bezier(.35,0,.25,1) infinite}
    .cell{animation:none 24s linear infinite}
    .m0{animation-name:cellCycle0}
    .m1{animation-name:cellCycle1}
    .m2{animation-name:cellCycle2}
    .m3{animation-name:cellCycle3}
    .m4{animation-name:cellCycle4}
    .m5{animation-name:cellCycle5}
    .m6{animation-name:cellCycle6}
