    @keyframes orbB{to{transform:translate(-26px,-18px) scale(1.1)}}
    @keyframes orbC{to{transform:translate(16px,-22px) scale(1.14)}}
    @keyframes sheen{0%,22%{transform:translateX(-260px) rotate(18deg);opacity:0}38%{opacity:.5}70%,100%{transform:translateX(300px) rotate(18deg);opacity:0}}
