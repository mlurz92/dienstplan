[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dienstplanrad-autoplan-v9-solver"
version = "0.9.0"
description = "OR-Tools CP-SAT guided exact-LNS solver for DienstplanRAD"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.116.1",
  "orjson==3.11.1",
  "ortools==9.15.6755",
  "pydantic==2.11.7",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.0",
  "pytest==8.4.1",
  "ruff==0.12.5"
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
